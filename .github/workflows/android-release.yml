name: Android APK → Aliyun

# 一键触发：Actions 页面点 "Run workflow"；或打 v* tag 自动跑。
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'EXPO_PUBLIC_API_URL（留空则用仓库变量 vars.API_URL）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

# 同一时间只跑一个，避免两个构建同时覆盖服务器上的同一个 apk
concurrency:
  group: android-release
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # npm ci 会触发 package.json 的 postinstall(patch-package) 打上 patches/*.patch
      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (generate android/)
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.API_URL }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Place release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "keystore placed"
          else
            echo "no keystore secret → release 将回退 debug 签名"
          fi

      - name: Inject release signing into build.gradle
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/patch-android-signing.mjs

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.API_URL }}
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dietai-agent-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST || '8.148.205.221' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload APK to Aliyun
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST || '8.148.205.221' }}
          SSH_USER: ${{ secrets.ALIYUN_USER || 'deploy' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH || '/home/deploy/downloads/dietai-agent-latest.apk' }}
        run: |
          REMOTE_DIR="$(dirname "$REMOTE_PATH")"
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          scp -P "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            android/app/build/outputs/apk/release/app-release.apk \
            "$SSH_USER@$SSH_HOST:$REMOTE_PATH"
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "ls -lh '$REMOTE_PATH'"