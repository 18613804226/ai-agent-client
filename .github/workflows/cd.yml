name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Secrets
        run: |
          if [ -z "${{ secrets.ALIYUN_HOST }}" ]; then
            echo "::error::ALIYUN_HOST secret is not set." && exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set." && exit 1
          fi
          if [ -z "${{ secrets.ALIYUN_USER }}" ]; then
            echo "::error::ALIYUN_USER secret is not set." && exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production .env
        run: echo "EXPO_PUBLIC_API_URL=${{ vars.API_URL }}" > .env

      - name: Build web
        run: pnpm exec expo export --platform web

      # 部署走 runner 自带的 ssh/scp，不再用 appleboy/ssh-action / scp-action：
      # 那两个 action 运行时要从 GitHub Releases 下载 drone-ssh / drone-scp 二进制，
      # 版本下架（404）、官方 CDN（504）、ghproxy.net 镜像（502）已经轮着挂过一轮，
      # 换任何公共代理仍是同一个坑。ubuntu-latest 自带 openssh-client，零下载。
      # 写法与 android-release.yml 的 Configure SSH / Upload APK 保持一致。
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
          SSH_PORT: ${{ secrets.ALIYUN_PORT || 22 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy web build
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
          SSH_USER: ${{ secrets.ALIYUN_USER }}
          SSH_PORT: ${{ secrets.ALIYUN_PORT || 22 }}
          REMOTE_DIR: /home/deploy/ai-agent-web
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          # 等价原 scp-action 的 source: dist/ + strip_components: 1：
          # 把 dist 目录内容（含隐藏文件）铺到目标根，不带 dist 这一层。
          # 用 tar 单连接传输，避免 scp -r 在 OpenSSH 9 的 SFTP 模式下对 `.` 的歧义。
          tar -czf - -C dist . | ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "tar -xzf - -C '$REMOTE_DIR'"
          # 不加 `| head`：Actions 的 bash 开了 pipefail，head 提前退出会让
          # ls 收 SIGPIPE 返回 141，部署成功却被判失败。
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" "ls -la '$REMOTE_DIR'"
