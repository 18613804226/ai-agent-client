name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate GitHub Secrets
        run: |
          if [ -z "${{ secrets.ALIYUN_HOST }}" ]; then
            echo "::error::ALIYUN_HOST secret is not set." && exit 1
          fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set." && exit 1
          fi
          if [ -z "${{ secrets.ALIYUN_USER }}" ]; then
            echo "::error::ALIYUN_USER secret is not set." && exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production .env
        run: echo "EXPO_PUBLIC_API_URL=${{ vars.API_URL }}" > .env

      - name: Build web
        run: pnpm exec expo export --platform web

      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.1.0
        env:
          # drone-ssh v1.7.7 已从 GitHub Releases 下架（404），且 GitHub 的
          # release 下载 CDN 对 CI 不稳定（504）。走 ghproxy 镜像下载现存版本。
          DRONE_SSH_VERSION: 1.8.6
          DRONE_SSH_RELEASE_URL: https://ghproxy.net/https://github.com/appleboy/drone-ssh/releases/download
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.ALIYUN_PORT || 22 }}
          script: mkdir -p /home/deploy/ai-agent-web

      - name: Upload web build
        uses: appleboy/scp-action@v1.0.0
        env:
          # GitHub release 下载 CDN 对 CI 不稳定（504），走 ghproxy 镜像。
          DRONE_SCP_RELEASE_URL: https://ghproxy.net/https://github.com/appleboy/drone-scp/releases/download
        with:
          # drone-scp v1.8.0 已从 GitHub Releases 下架（404）。
          # scp-action 是 composite action，action.yml 内部把
          # DRONE_SCP_VERSION: ${{ inputs.version }} 写死，step 级 env 会被覆盖，
          # 所以必须用 with.version 传版本。
          version: 1.8.3
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.ALIYUN_PORT || 22 }}
          source: 'dist/'
          target: '/home/deploy/ai-agent-web'
          strip_components: 1
